<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Batyr Ninja</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:'Courier New',monospace}
canvas{display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── SETUP ────────────────────────────────────────────────────────────────────
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=800,H=400;
C.width=W;C.height=H;

(function resize(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  C.style.width=Math.round(W*s)+'px';
  C.style.height=Math.round(H*s)+'px';
  window.addEventListener('resize',resize,{once:true});
})();

// ── AUDIO ────────────────────────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function tone(f,t,d,v=0.3,delay=0){
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=t;o.frequency.value=f;
    const st=AC.currentTime+delay;
    g.gain.setValueAtTime(v,st);
    g.gain.exponentialRampToValueAtTime(0.001,st+d);
    o.start(st);o.stop(st+d);
  }catch(e){}
}
const sfx={
  jump:  ()=>{tone(320,'square',.08,.18);tone(480,'square',.05,.1)},
  djump: ()=>{tone(480,'square',.08,.18);tone(720,'square',.05,.1)},
  land:  ()=>{tone(120,'sawtooth',.06,.12)},
  coin:  ()=>{tone(880,'sine',.1,.18);tone(1320,'sine',.07,.12,.04)},
  hit:   ()=>{tone(80,'sawtooth',.25,.45)},
  die:   ()=>{[0,.15,.3,.5].forEach((d,i)=>tone([300,240,180,100][i],'sawtooth',.3,.4,d))},
  start: ()=>{[0,.1,.2,.35].forEach((d,i)=>tone([262,330,392,523][i],'square',.28,.22,d))},
  slide: ()=>{tone(180,'square',.1,.15)},
};

// ── CONSTANTS ────────────────────────────────────────────────────────────────
const GY=335;  // ground y
const GRAVity=0.72;
const JUMP1=-15.5;
const JUMP2=-13;

// ── STATE ────────────────────────────────────────────────────────────────────
let state='menu'; // menu | play | over
let score=0,best=0,dist=0,spd=5.5,fc=0,invincible=0;
let lives=3;

const pl={
  x:110,y:GY,vy:0,
  jumps:0,
  sliding:false,slideTicks:0,
  anim:0,animTick:0,
  onGround:true,
};

let obstacles=[],coins=[],particles=[],texts=[];

// ── BACKGROUND SCROLL ────────────────────────────────────────────────────────
let sc1=0,sc2=0,sc3=0,sc4=0; // layer scroll offsets

// Deterministic pseudo-random from seed
function rng(seed){seed=Math.sin(seed*127.1+311.7)*43758.5453;return seed-Math.floor(seed);}

// ── STARS ────────────────────────────────────────────────────────────────────
const STARS=Array.from({length:90},(_,i)=>({
  x:rng(i*3)*W, y:rng(i*3+1)*220,
  r:rng(i*3+2)*1.4+0.3,
  phase:rng(i*5)*Math.PI*2
}));

// ── GAME LOOP ────────────────────────────────────────────────────────────────
let lastT=performance.now(),acc=0;
const FDT=1000/60;
function loop(ts){
  acc+=Math.min(ts-lastT,50);lastT=ts;
  while(acc>=FDT){update();acc-=FDT;}
  draw();
  requestAnimationFrame(loop);
}

// ── UPDATE ────────────────────────────────────────────────────────────────────
function update(){
  fc++;
  if(state!=='play')return;

  dist++;
  score=Math.floor(dist/8);
  spd=5.5+Math.min(dist/2400,4.5); // 5.5 → 10 over ~10 min

  // Scroll layers
  sc1=(sc1+spd*0.12)%(W*2);
  sc2=(sc2+spd*0.35)%(W*2);
  sc3=(sc3+spd*0.65)%(W*2);
  sc4=(sc4+spd)%50;

  // Player physics
  if(!pl.sliding){
    pl.vy+=GRAVity;
    pl.y+=pl.vy;
    if(pl.y>=GY){pl.y=GY;if(pl.vy>3)sfx.land();pl.vy=0;pl.jumps=0;pl.onGround=true;}
    else pl.onGround=false;
  }

  // Slide countdown
  if(pl.sliding){pl.slideTicks--;if(pl.slideTicks<=0){pl.sliding=false;pl.onGround=true;}}

  // Run animation
  if(pl.onGround&&!pl.sliding){
    pl.animTick++;
    if(pl.animTick>=7){pl.animTick=0;pl.anim=(pl.anim+1)%4;}
  }

  // Invincibility
  if(invincible>0)invincible--;

  // Spawn
  const gap=Math.max(55,110-Math.floor(dist/180));
  if(fc%gap===0)spawnObstacle();
  if(fc%52===0)spawnCoin();

  // Move & collide
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.x-=spd;
    if(o.x<-120){obstacles.splice(i,1);continue;}
    if(invincible===0&&collides(pl,o)){hit();}
  }
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i];
    c.x-=spd;c.t++;
    if(c.x<-30){coins.splice(i,1);continue;}
    if(Math.abs(pl.x-c.x)<22&&Math.abs(pl.y-8-c.y)<28){
      score+=5;sfx.coin();
      spawnText(c.x,c.y-30,'+5','#ffd700');
      burst(c.x,c.y,'#ffd700',6);
      coins.splice(i,1);
    }
  }

  // Particles & texts
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=texts.length-1;i>=0;i--){
    texts[i].y-=0.6;texts[i].life--;
    if(texts[i].life<=0)texts.splice(i,1);
  }
}

function collides(p,o){
  const pw=10,ph=p.sliding?28:54;
  const px1=p.x-pw,px2=p.x+pw;
  const py1=p.y-ph,py2=p.y;
  return px2>o.hx1&&px1<o.hx2&&py2>o.hy1&&py1<o.hy2;
}

function hit(){
  lives--;invincible=110;
  sfx.hit();burst(pl.x,pl.y-30,'#ff4400',10);
  spawnText(pl.x,pl.y-70,'-1 ♥','#ff2200');
  if(lives<=0){state='over';if(score>best)best=score;sfx.die();}
}

function doJump(){
  if(pl.sliding)return;
  if(pl.jumps<2){
    pl.vy=pl.jumps===0?JUMP1:JUMP2;
    pl.onGround=false;
    pl.jumps===0?sfx.jump():sfx.djump();
    burst(pl.x,pl.y,'#ffffff',5);
    pl.jumps++;
  }
}

function doSlide(){
  if(!pl.onGround||pl.sliding)return;
  pl.sliding=true;pl.slideTicks=38;
  sfx.slide();burst(pl.x,pl.y,'#8888ff',4);
}

// ── SPAWN ─────────────────────────────────────────────────────────────────────
function spawnObstacle(){
  const r=Math.random();
  if(r<0.52){
    // Ground obstacle — must jump
    const kind=Math.floor(Math.random()*3);
    const h=kind===1?72:50+Math.random()*20|0;
    const w=kind===0?28:kind===1?22:38;
    obstacles.push({
      x:W+60,kind,type:'ground',h,w,
      hx1:W+60-w/2,hx2:W+60+w/2,
      hy1:GY-h,hy2:GY
    });
  } else if(r<0.78){
    // Hanging lantern — duck/slide under
    const gap=88+Math.random()*20|0; // y of center above GY
    obstacles.push({
      x:W+60,type:'hang',h:38,w:26,
      hx1:W+60-13,hx2:W+60+13,
      hy1:GY-gap-19,hy2:GY-gap+19
    });
  } else {
    // Flying shuriken — jumps or ducks
    const yy=GY-(60+Math.random()*80|0);
    obstacles.push({
      x:W+60,type:'shuriken',h:20,w:20,
      hy1:yy-10,hy2:yy+10,
      hx1:W+60-10,hx2:W+60+10,
      yy
    });
  }
}

// Keep obstacle hitboxes in sync as x moves
// (we recalculate in collides instead)
function collides(p,o){
  const pw=10,ph=p.sliding?28:54;
  const px1=p.x-pw,px2=p.x+pw;
  const py1=p.y-ph,py2=p.y;
  const ox1=o.x-(o.w||o.h)/2-2,ox2=o.x+(o.w||o.h)/2+2;
  let oy1,oy2;
  if(o.type==='ground'){oy1=GY-o.h;oy2=GY;}
  else if(o.type==='hang'){const gap=o.hy1+19+o.h/2-GY;oy1=o.hy1;oy2=o.hy2;}
  else{oy1=o.yy-10;oy2=o.yy+10;}
  return px2>ox1&&px1<ox2&&py2>oy1&&py1<oy2;
}

function spawnCoin(){
  const high=Math.random()<0.38;
  const y=high?GY-130-Math.random()*50|0:GY-28-Math.random()*18|0;
  coins.push({x:W+30,y,t:Math.random()*62|0});
}

function burst(x,y,col,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=1.5+Math.random()*3.5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,
      r:1.5+Math.random()*2.5,col,life:18+Math.random()*18|0});
  }
}

function spawnText(x,y,txt,col){
  texts.push({x,y,txt,col,life:50});
}

function startGame(){
  state='play';dist=0;score=0;spd=5.5;fc=0;invincible=0;lives=3;
  obstacles=[];coins=[];particles=[];texts=[];
  pl.y=GY;pl.vy=0;pl.jumps=0;pl.sliding=false;pl.slideTicks=0;
  pl.anim=0;pl.animTick=0;pl.onGround=true;
  sc1=sc2=sc3=sc4=0;
  AC.resume();sfx.start();
}

// ── DRAW ──────────────────────────────────────────────────────────────────────
function draw(){
  drawSky();
  drawStars();
  drawMoon();
  drawFuji();
  drawFarBuildings();
  drawNearBuildings();
  drawStreet();
  drawGround();
  if(state!=='menu'){
    drawObstacles();
    drawCoins();
    drawParticlesFn();
    drawPlayer();
    drawTextsFn();
    drawHUD();
  }
  if(state==='menu')drawMenu();
  if(state==='over')drawOver();
}

// ── BACKGROUND ───────────────────────────────────────────────────────────────
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04001a');g.addColorStop(0.55,'#0c0830');g.addColorStop(1,'#1a0f3a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawStars(){
  STARS.forEach(s=>{
    const a=0.45+0.55*Math.sin(s.phase+fc*0.025);
    ctx.globalAlpha=a;
    ctx.fillStyle='#fffde8';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function drawMoon(){
  const mx=W*0.82,my=55;
  ctx.save();
  ctx.shadowColor='#ffe8a0';ctx.shadowBlur=35;
  const mg=ctx.createRadialGradient(mx,my,8,mx,my,38);
  mg.addColorStop(0,'rgba(255,240,180,.25)');mg.addColorStop(1,'rgba(255,240,180,0)');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff8d4';ctx.beginPath();ctx.arc(mx,my,20,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0c0830';ctx.beginPath();ctx.arc(mx-7,my,16,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawFuji(){
  const by=GY-45;
  ctx.save();
  ctx.fillStyle='#160a30';
  ctx.beginPath();ctx.moveTo(220,by);ctx.lineTo(370,by-125);ctx.lineTo(510,by);ctx.closePath();ctx.fill();
  ctx.fillStyle='#ddd0ee';
  ctx.beginPath();
  ctx.moveTo(348,by-102);ctx.lineTo(370,by-125);ctx.lineTo(392,by-102);
  ctx.lineTo(378,by-98);ctx.lineTo(370,by-110);ctx.lineTo(362,by-98);
  ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawFarBuildings(){
  ctx.save();
  const baseY=GY-42;
  for(let i=-1;i<=Math.ceil(W/72)+1;i++){
    const sx=(i+Math.floor(sc1/72))*13;
    const x=i*72-(sc1%72);
    const bw=34+rng(sx)*28|0;
    const bh=55+rng(sx+1)*90|0;
    const by=baseY-bh;
    ctx.fillStyle=`hsl(${240+rng(sx+2)*20|0},30%,${8+rng(sx+3)*6|0}%)`;
    ctx.fillRect(x,by,bw,bh);
    const cols=Math.max(1,bw/13|0),rows=Math.max(1,bh/14|0);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const ws=sx+r*7+c*3;
      if(rng(ws)>0.35){
        ctx.fillStyle=`hsl(${160+rng(ws+1)*80|0},60%,${25+rng(ws+2)*25|0}%)`;
        ctx.fillRect(x+c*13+2,by+r*14+3,8,8);
      }
    }
  }
  ctx.restore();
}

function drawNearBuildings(){
  ctx.save();
  const baseY=GY-28;
  for(let i=-1;i<=Math.ceil(W/55)+1;i++){
    const sx=(i+Math.floor(sc2/55))*17+200;
    const x=i*55-(sc2%55);
    const bw=24+rng(sx)*26|0;
    const bh=38+rng(sx+1)*70|0;
    const by=baseY-bh;
    ctx.fillStyle=`hsl(${220+rng(sx+2)*30|0},35%,${6+rng(sx+3)*7|0}%)`;
    ctx.fillRect(x,by,bw,bh);
    // Neon sign on some buildings
    if(rng(sx+4)>0.55){
      const neonCols=['#ff0055','#00ffcc','#ff8800','#aa00ff','#00ff88'];
      const nc=neonCols[Math.floor(rng(sx+5)*neonCols.length)];
      const glyphs=['忍','東','京','刀','侍','夜','力','龍'];
      ctx.save();
      ctx.shadowColor=nc;ctx.shadowBlur=12;
      ctx.fillStyle=nc;ctx.font=`bold ${11+rng(sx+6)*5|0}px sans-serif`;
      ctx.fillText(glyphs[Math.floor(rng(sx+7)*glyphs.length)],x+3,by+16);
      ctx.restore();
    }
    // Windows
    const cols=Math.max(1,bw/10|0),rows=Math.max(1,bh/12|0);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const ws=sx+r*5+c*2+500;
      if(rng(ws)>0.4){
        ctx.fillStyle=`hsl(${180+rng(ws+1)*60|0},55%,${30+rng(ws+2)*20|0}%)`;
        ctx.fillRect(x+c*10+2,by+r*12+2,6,8);
      }
    }
  }
  ctx.restore();
}

function drawStreet(){
  ctx.save();
  // Lamp posts
  for(let i=-1;i<=Math.ceil(W/160)+1;i++){
    const x=i*160-(sc3%160);
    ctx.fillStyle='#22183a';
    ctx.fillRect(x-2,GY-88,4,88);
    ctx.fillRect(x-2,GY-88,22,3);
    ctx.save();
    ctx.shadowColor='#ffdd99';ctx.shadowBlur=18;
    ctx.fillStyle='#ffdd99';
    ctx.beginPath();ctx.arc(x+20,GY-88,5,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // Cone of light
    ctx.fillStyle='rgba(255,220,130,0.04)';
    ctx.beginPath();ctx.moveTo(x+20,GY-88);ctx.lineTo(x-10,GY);ctx.lineTo(x+50,GY);ctx.closePath();ctx.fill();
  }
  // Vending machines
  for(let i=-1;i<=Math.ceil(W/280)+1;i++){
    const x=i*280+90-(sc3*0.8%280);
    drawVendingMachine(x,GY);
  }
  // Cherry trees
  for(let i=-1;i<=Math.ceil(W/240)+1;i++){
    const x=i*240+160-(sc3*0.9%240);
    drawCherryTree(x,GY);
  }
  ctx.restore();
}

function drawVendingMachine(x,y){
  ctx.save();
  ctx.fillStyle='#cc0020';ctx.fillRect(x-10,y-46,20,46);
  ctx.fillStyle='#110010';ctx.fillRect(x-7,y-40,14,26);
  ctx.save();ctx.shadowColor='#00ffcc';ctx.shadowBlur=8;
  ctx.fillStyle='#00ffcc';ctx.fillRect(x-5,y-38,10,10);
  ctx.fillStyle='#00aaff';ctx.fillRect(x-5,y-26,10,10);
  ctx.restore();
  ctx.fillStyle='#880010';ctx.fillRect(x-10,y-46,20,4);
  ctx.restore();
}

function drawCherryTree(x,y){
  ctx.save();
  ctx.fillStyle='#3a2010';ctx.fillRect(x-3,y-55,6,55);
  ctx.strokeStyle='#3a2010';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x,y-42);ctx.lineTo(x-18,y-68);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y-42);ctx.lineTo(x+18,y-68);ctx.stroke();
  const buds=[[0,-72,26],[-16,-70,18],[16,-70,18],[-8,-88,14],[8,-88,14]];
  ctx.shadowColor='#ff99bb';ctx.shadowBlur=6;
  buds.forEach(([bx,by,r])=>{
    ctx.fillStyle='rgba(255,150,185,0.8)';
    ctx.beginPath();ctx.arc(x+bx,y+by,r,0,Math.PI*2);ctx.fill();
  });
  // Petals falling
  for(let p=0;p<3;p++){
    const px=x+(rng(x*0.01+p+fc*0.001)*60-30);
    const py=y-60+((fc*0.4+p*33)%80);
    ctx.globalAlpha=0.5;ctx.fillStyle='#ffaad0';
    ctx.beginPath();ctx.ellipse(px,py,3,2,fc*0.05+p,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawGround(){
  const g=ctx.createLinearGradient(0,GY,0,H);
  g.addColorStop(0,'#1c1430');g.addColorStop(1,'#110d22');
  ctx.fillStyle=g;ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#2a1f44';ctx.fillRect(0,GY,W,5);
  // Road dashes
  ctx.fillStyle='rgba(255,255,255,0.1)';
  for(let i=-1;i<=Math.ceil(W/50)+1;i++){
    ctx.fillRect(i*50-(sc4%50),GY+20,24,3);
  }
  // Reflections on road
  ctx.fillStyle='rgba(255,120,200,0.04)';
  ctx.fillRect(0,GY+8,W,H-GY-8);
}

// ── DRAW OBSTACLES ───────────────────────────────────────────────────────────
function drawObstacles(){
  obstacles.forEach(o=>{
    ctx.save();ctx.translate(o.x,0);
    if(o.type==='ground')drawGroundObs(o);
    else if(o.type==='hang')drawLantern(o);
    else drawShuriken(o);
    ctx.restore();
  });
}

function drawGroundObs(o){
  const x=0,y=GY;
  switch(o.kind){
    case 0:{ // Wooden barrier
      ctx.fillStyle='#7a3a10';ctx.fillRect(-o.w/2,y-o.h,o.w,o.h);
      ctx.fillStyle='#9a5a28';ctx.fillRect(-o.w/2,y-o.h,o.w,7);
      for(let s=0;s<3;s++){
        ctx.fillStyle=s%2?'#ff5500':'#ffaa00';
        ctx.fillRect(-o.w/2+s*o.w/3,y-o.h+9,o.w/3-1,o.h-9);
      }
      ctx.strokeStyle='#5a2a08';ctx.lineWidth=1;
      ctx.strokeRect(-o.w/2,y-o.h,o.w,o.h);
      break;}
    case 1:{ // Tall shrine torii gate segment
      ctx.fillStyle='#cc2200';
      ctx.fillRect(-o.w/2,y-o.h,o.w,o.h);
      ctx.fillStyle='#aa1800';
      ctx.fillRect(-o.w/2,y-o.h,o.w,8);
      ctx.fillRect(-o.w/2,y-o.h+8,3,o.h-8);
      ctx.fillRect(o.w/2-3,y-o.h+8,3,o.h-8);
      break;}
    case 2:{ // Sake barrel
      const hy=y-o.h/2;
      ctx.fillStyle='#8b3a1a';
      ctx.beginPath();ctx.ellipse(0,hy,o.w/2,o.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#5a200a';ctx.lineWidth=3;
      [-0.3,0,0.3].forEach(t=>{
        ctx.beginPath();ctx.ellipse(0,hy,o.w/2,o.h/2*Math.abs(t||0.05),0,0,Math.PI*2);ctx.stroke();
      });
      ctx.save();ctx.shadowColor='#ff0000';ctx.shadowBlur=6;
      ctx.fillStyle='#ff0000';ctx.font='bold 11px sans-serif';ctx.textAlign='center';
      ctx.fillText('酒',0,hy+4);ctx.restore();
      break;}
  }
}

function drawLantern(o){
  // String from top
  ctx.strokeStyle='#3a1818';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,o.hy1-GY+10);ctx.stroke();
  // Lantern body
  const cy=o.hy1+o.h/2+5; // rough center y
  ctx.save();
  ctx.translate(0,cy);
  ctx.shadowColor='#ff5500';ctx.shadowBlur=20;
  ctx.fillStyle='#cc1a00';
  ctx.beginPath();ctx.ellipse(0,0,13,19,0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#ff8800';ctx.lineWidth=1.5;
  [-8,0,8].forEach(dx=>{ctx.beginPath();ctx.ellipse(dx,0,3,19,0,0,Math.PI*2);ctx.stroke();});
  ctx.fillStyle='rgba(255,200,100,0.7)';
  ctx.beginPath();ctx.ellipse(0,0,5,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc00';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('提',0,4);
  ctx.restore();
}

function drawShuriken(o){
  ctx.save();ctx.translate(0,o.yy);
  ctx.rotate(fc*0.12);
  ctx.shadowColor='#aaaaff';ctx.shadowBlur=10;
  ctx.fillStyle='#b8b8cc';
  for(let i=0;i<4;i++){
    ctx.save();ctx.rotate(i*Math.PI/2);
    ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(5,-4);ctx.lineTo(0,0);ctx.lineTo(-5,-4);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#9090aa';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── DRAW COINS ───────────────────────────────────────────────────────────────
function drawCoins(){
  coins.forEach(c=>{
    const bob=Math.sin(c.t*0.07)*5;
    ctx.save();ctx.translate(c.x,c.y+bob);
    ctx.shadowColor='#ffd700';ctx.shadowBlur=14;
    ctx.fillStyle='#ffd700';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#cc9900';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.save();ctx.shadowColor='#ffd700';ctx.shadowBlur=4;
    ctx.fillStyle='#ffd700';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
    ctx.fillText('¥',0,3);ctx.restore();
    ctx.restore();
  });
}

// ── DRAW PLAYER ──────────────────────────────────────────────────────────────
const RUN=[
  {lf:-0.42,lb:0.42,af:0.32,ab:-0.32,sc:0},
  {lf:-0.12,lb:0.12,af:0.10,ab:-0.10,sc:1},
  {lf:0.42,lb:-0.42,af:-0.32,ab:0.32,sc:0},
  {lf:0.12,lb:-0.12,af:-0.10,ab:0.10,sc:-1},
];

function drawPlayer(){
  if(invincible>0&&Math.floor(invincible/5)%2===1)return;
  ctx.save();
  ctx.translate(pl.x,pl.y);
  if(pl.sliding){
    ctx.translate(0,-12);ctx.rotate(-0.25);
    drawNinja({lf:0.9,lb:-0.6,af:-0.2,ab:0.1,sc:3,lean:0.25,crouched:true});
  } else if(!pl.onGround){
    const tuck=pl.vy<0?-0.32:0.18;
    drawNinja({lf:tuck,lb:-tuck,af:-0.55,ab:0.55,sc:2,lean:-0.08,crouched:false});
  } else {
    const c=RUN[pl.anim];
    drawNinja({lf:c.lf,lb:c.lb,af:c.af,ab:c.ab,sc:c.sc,lean:0.04,crouched:false});
  }
  ctx.restore();
}

function drawNinja({lf,lb,af,ab,sc,lean,crouched}){
  const off=crouched?-8:-14; // foot offset from y=0
  ctx.translate(0,off);

  // Scarf
  ctx.save();
  ctx.strokeStyle='#cc0000';ctx.lineWidth=5;ctx.lineCap='round';
  ctx.shadowColor='#ff0000';ctx.shadowBlur=7;
  ctx.beginPath();ctx.moveTo(-3,-40);
  ctx.quadraticCurveTo(-16+sc*4,-34,-30+sc*6,-25+sc*2);
  ctx.stroke();ctx.shadowBlur=0;ctx.restore();

  ctx.save();ctx.rotate(lean);

  // ─ Back leg ─
  ctx.strokeStyle='#1a1a2a';ctx.lineWidth=7;ctx.lineCap='round';
  ctx.save();ctx.rotate(lb);
  ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,0);ctx.stroke();
  ctx.save();ctx.translate(0,0);ctx.rotate(-lb*0.45);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,16);ctx.stroke();
  ctx.fillStyle='#111';ctx.fillRect(-3,14,15,5);ctx.restore();
  ctx.restore();

  // ─ Front leg ─
  ctx.save();ctx.rotate(lf);
  ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,0);ctx.stroke();
  ctx.save();ctx.translate(0,0);ctx.rotate(-lf*0.45);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,16);ctx.stroke();
  ctx.fillStyle='#222';ctx.fillRect(-3,14,15,5);ctx.restore();
  ctx.restore();

  // ─ Torso ─
  ctx.fillStyle='#111118';ctx.fillRect(-9,-43,18,28);
  ctx.fillStyle='#cc0000';ctx.fillRect(-10,-21,20,4); // belt
  ctx.fillStyle='#1a1a2a';ctx.fillRect(-9,-43,18,7); // shoulder

  // ─ Back arm ─
  ctx.save();ctx.translate(-5,-36);ctx.rotate(ab);
  ctx.strokeStyle='#1a1a2a';ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18);ctx.stroke();ctx.restore();

  // ─ Front arm + katana ─
  ctx.save();ctx.translate(5,-36);ctx.rotate(af);
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,18);ctx.stroke();
  ctx.save();ctx.shadowColor='#aaaaff';ctx.shadowBlur=5;
  ctx.strokeStyle='#d0d0e8';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,18);ctx.lineTo(24,-6);ctx.stroke();
  ctx.fillStyle='#8a6a30';ctx.fillRect(-1,14,3,6); // grip
  ctx.restore();ctx.restore();

  // ─ Head ─
  ctx.translate(0,-56);ctx.rotate(crouched?0.1:0);
  ctx.fillStyle='#1e1e2a';ctx.beginPath();ctx.arc(0,0,11,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#cc0000';ctx.fillRect(-11,-4,22,6); // headband
  ctx.fillStyle='#111';ctx.fillRect(-11,2,22,10);    // lower face mask
  // Eyes
  ctx.fillStyle='#fff';ctx.fillRect(-7,-3,4,4);ctx.fillRect(2,-3,4,4);
  ctx.save();ctx.shadowColor='#00ffcc';ctx.shadowBlur=6;
  ctx.fillStyle='#00ffcc';ctx.fillRect(-6,-2,2,2);ctx.fillRect(3,-2,2,2);
  ctx.restore();
  // Headband knot at back
  ctx.fillStyle='#aa0000';ctx.fillRect(7,0,5,4);

  ctx.restore(); // lean
}

// ── PARTICLES & TEXTS ────────────────────────────────────────────────────────
function drawParticlesFn(){
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/36);
    ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawTextsFn(){
  texts.forEach(t=>{
    ctx.globalAlpha=Math.min(1,t.life/20);
    ctx.fillStyle=t.col;ctx.font='bold 15px Courier New';ctx.textAlign='center';
    ctx.fillText(t.txt,t.x,t.y);
  });
  ctx.globalAlpha=1;ctx.textAlign='left';
}

// ── HUD ───────────────────────────────────────────────────────────────────────
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.48)';ctx.fillRect(0,0,W,38);
  // Score
  ctx.fillStyle='#ffffff';ctx.font='bold 18px Courier New';ctx.textAlign='left';
  ctx.fillText('SCORE '+score,12,25);
  // Best
  ctx.fillStyle='#ff8800';ctx.font='13px Courier New';ctx.textAlign='center';
  ctx.fillText('BEST '+best,W/2,24);
  // Lives
  for(let i=0;i<3;i++){
    ctx.save();
    ctx.shadowColor=i<lives?'#ff0000':'transparent';ctx.shadowBlur=i<lives?8:0;
    ctx.fillStyle=i<lives?'#ff2200':'#2a1a1a';
    ctx.font='20px sans-serif';ctx.textAlign='right';
    ctx.fillText('♥',W-14-i*26,26);
    ctx.restore();
  }
  // Speed bar
  const barX=W/2-50,barY=30,barW=100;
  ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fillRect(barX,barY,barW,4);
  ctx.fillStyle='#00ffcc';ctx.globalAlpha=0.6;
  ctx.fillRect(barX,barY,(spd-5.5)/4.5*barW,4);
  ctx.globalAlpha=1;
  ctx.textAlign='left';
}

// ── MENU / OVER SCREENS ───────────────────────────────────────────────────────
function drawMenu(){
  ctx.fillStyle='rgba(0,0,8,0.72)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.textAlign='center';

  // Title
  ctx.font='bold 58px Courier New';
  ctx.shadowColor='#ff0000';ctx.shadowBlur=30;
  ctx.fillStyle='#cc0000';ctx.fillText('BATYR',W/2,H/2-50);
  ctx.shadowColor='#aaaaff';ctx.shadowBlur=20;
  ctx.fillStyle='#ffffff';ctx.fillText('NINJA',W/2,H/2+8);
  ctx.shadowBlur=0;

  ctx.font='13px Courier New';ctx.fillStyle='#00ffcc';
  ctx.fillText('東京の夜 · TOKYO NIGHTS',W/2,H/2+36);

  if(Math.floor(fc/28)%2===0){
    ctx.fillStyle='#ffffff';ctx.font='15px Courier New';
    ctx.fillText('PRESS SPACE  or  CLICK  TO START',W/2,H/2+72);
  }

  ctx.fillStyle='#555';ctx.font='11px Courier New';
  ctx.fillText('SPACE / ↑  jump  (double jump!)     S / ↓  slide under obstacles',W/2,H-14);
  ctx.restore();
}

function drawOver(){
  ctx.fillStyle='rgba(0,0,5,0.78)';ctx.fillRect(0,46,W,H-46);
  ctx.save();ctx.textAlign='center';

  ctx.font='bold 44px Courier New';
  ctx.shadowColor='#ff0000';ctx.shadowBlur=22;
  ctx.fillStyle='#ff2200';ctx.fillText('GAME OVER',W/2,H/2-25);
  ctx.shadowBlur=0;

  ctx.font='bold 22px Courier New';ctx.fillStyle='#ffffff';
  ctx.fillText('Score: '+score,W/2,H/2+14);

  if(score>0&&score>=best){
    ctx.save();ctx.shadowColor='#ffd700';ctx.shadowBlur=14;
    ctx.fillStyle='#ffd700';ctx.font='bold 18px Courier New';
    ctx.fillText('★ NEW BEST!',W/2,H/2+42);
    ctx.restore();
  } else {
    ctx.fillStyle='#666';ctx.font='15px Courier New';
    ctx.fillText('Best: '+best,W/2,H/2+42);
  }

  if(Math.floor(fc/28)%2===0){
    ctx.fillStyle='#00ffcc';ctx.font='15px Courier New';
    ctx.fillText('PRESS SPACE  or  CLICK  TO RETRY',W/2,H/2+78);
  }
  ctx.restore();
}

// ── INPUT ─────────────────────────────────────────────────────────────────────
function onAction(){
  AC.resume();
  if(state==='menu'||state==='over')startGame();
  else if(state==='play')doJump();
}
document.addEventListener('keydown',e=>{
  if([' ','ArrowUp'].includes(e.key)){e.preventDefault();onAction();}
  if(['ArrowDown','s','S'].includes(e.key)){e.preventDefault();if(state==='play')doSlide();}
});
document.addEventListener('click',onAction);
document.addEventListener('touchstart',e=>{e.preventDefault();onAction();},{passive:false});

// ── START ─────────────────────────────────────────────────────────────────────
requestAnimationFrame(loop);
</script>
</body>
</html>
