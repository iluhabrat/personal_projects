<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Kombat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Courier New',monospace;color:#fff;user-select:none;overflow:hidden}
canvas{display:block;image-rendering:pixelated;width:100vw;height:57.5vw;max-height:100vh;max-width:calc(100vh * 800/460)}
#ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#ui.active{pointer-events:all}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:rgba(0,0,0,.88)}
.screen.show{display:flex}
h1{font-size:48px;font-weight:900;letter-spacing:8px;color:#c00;text-shadow:0 0 30px #f00,0 0 60px #f005;margin-bottom:4px}
h2{font-size:16px;color:#666;letter-spacing:4px;margin-bottom:36px}
.btn{background:#0d0008;border:2px solid #900;color:#fff;font-family:'Courier New',monospace;font-size:14px;font-weight:bold;letter-spacing:2px;padding:12px 28px;cursor:pointer;border-radius:3px;transition:.15s;pointer-events:all}
.btn:hover{background:#900;box-shadow:0 0 20px #f005}
.char-grid{display:flex;gap:16px;margin-bottom:24px}
.char-card{border:2px solid #333;border-radius:8px;padding:14px 18px;cursor:pointer;transition:.2s;text-align:center;min-width:140px;background:#0a0010;pointer-events:all}
.char-card:hover,.char-card.sel{border-color:#f80;box-shadow:0 0 20px #f804}
.char-card .cname{font-size:15px;font-weight:bold;letter-spacing:2px;margin-top:8px}
.char-card .ctitle{font-size:9px;color:#777;margin-bottom:6px}
.char-card canvas{border-radius:4px}
.char-card .stats{font-size:9px;color:#888;line-height:1.8;margin-top:6px;text-align:left}
.char-card .stats span{color:#aaa}
.vsrow{display:flex;gap:32px;align-items:center;margin-bottom:20px}
.vslabel{font-size:12px;color:#888;margin-bottom:8px;text-align:center;letter-spacing:2px}
.vs{font-size:36px;font-weight:900;color:#f80;text-shadow:0 0 20px #f80}
.controls{font-size:10px;color:#444;text-align:center;line-height:2.2;letter-spacing:1px;margin-top:8px}
.controls span{color:#777}
#banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:20}
#banner.show{display:flex}
#banner-text{font-size:58px;font-weight:900;letter-spacing:8px;color:#ff0;text-shadow:0 0 40px #f80,0 0 80px #f004;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(2.5);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<canvas id="c" width="800" height="460"></canvas>
<div id="ui">
  <!-- MENU -->
  <div class="screen show" id="scr-menu">
    <h1>SHADOW</h1><h2>K O M B A T</h2>
    <div style="display:flex;gap:16px">
      <button class="btn" id="btn-1p">1 PLAYER</button>
      <button class="btn" id="btn-2p">2 PLAYERS</button>
    </div>
  </div>
  <!-- SELECT -->
  <div class="screen" id="scr-select">
    <h1 style="font-size:28px;margin-bottom:4px">SELECT FIGHTER</h1>
    <div class="vsrow">
      <div><div class="vslabel">PLAYER 1</div><div class="char-grid" id="p1-grid"></div></div>
      <div class="vs">VS</div>
      <div><div class="vslabel" id="p2-label">PLAYER 2</div><div class="char-grid" id="p2-grid"></div></div>
    </div>
    <button class="btn" id="btn-fight" style="opacity:.4;pointer-events:none">FIGHT!</button>
    <div class="controls">
      <span>P1</span>: ←/→ Move &nbsp; ↑ Jump &nbsp; Z Punch &nbsp; X Kick &nbsp; C Block &nbsp; V Special<br>
      <span>P2</span>: A/D Move &nbsp; W Jump &nbsp; U Punch &nbsp; I Kick &nbsp; O Block &nbsp; J Special
    </div>
  </div>
  <!-- GAMEOVER -->
  <div class="screen" id="scr-over"></div>
</div>
<div id="banner"><div id="banner-text"></div></div>

<script>
// ── CANVAS ──────────────────────────────────────────────────────────────────
const C = document.getElementById('c'), ctx = C.getContext('2d');
const W = C.width, H = C.height;
const ui = document.getElementById('ui');

// ── AUDIO ───────────────────────────────────────────────────────────────────
const AC = new (window.AudioContext||window.webkitAudioContext)();
function tone(freq,type,dur,vol=0.3,det=0){
  try{const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=freq;o.detune.value=det;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur);}catch(e){}
}
function noise(dur,vol=0.4){
  try{const buf=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=AC.createBufferSource(),g=AC.createGain();
  s.buffer=buf;s.connect(g);g.connect(AC.destination);
  g.gain.value=vol;s.start();}catch(e){}
}
const sfx={
  punch:()=>{tone(160,'sawtooth',.09,.4);noise(.05,.2)},
  kick:()=>{tone(100,'sawtooth',.13,.5);noise(.08,.3)},
  block:()=>{tone(400,'square',.06,.2);tone(200,'square',.04,.1)},
  sword:()=>{tone(800,'sawtooth',.05,.2);tone(600,'sine',.1,.1)},
  hammer:()=>{tone(60,'sawtooth',.2,.6);noise(.15,.5)},
  daggers:()=>{tone(900,'square',.04,.15);tone(1100,'square',.03,.1)},
  scythe:()=>{tone(300,'sawtooth',.12,.3);tone(200,'sine',.15,.2)},
  special:()=>{[0,80,160,240].forEach((d,i)=>setTimeout(()=>tone(300+i*80,'sawtooth',.2,.35),d))},
  death:()=>{tone(100,'sawtooth',.8,.5);noise(.4,.3)},
  round:()=>{[0,150,300].forEach((d,i)=>setTimeout(()=>tone([523,659,784][i],'square',.25,.3),d))},
  finish:()=>{[0,100,200,350].forEach((d,i)=>setTimeout(()=>tone([80,120,100,60][i],'sawtooth',.35,.5),d))},
};

// ── CHARACTERS ──────────────────────────────────────────────────────────────
const CHARS = [
  {id:'blaze',name:'BLAZE',title:'The Flame Samurai',
   body:'#cc2200',body2:'#ff6633',accent:'#ffaa00',glow:'#ff4400',
   weapon:'katana',spd:5.2,pow:1.0,maxHp:100,
   desc:'Speed: ████░\nPower: ███░░\nRange: ████░',
   special:'Flame Slash',sfx:'sword'},
  {id:'titan',name:'TITAN',title:'The Iron Colossus',
   body:'#1133cc',body2:'#4477ff',accent:'#00ddff',glow:'#0088ff',
   weapon:'hammer',spd:3.2,pow:1.8,maxHp:135,
   desc:'Speed: ██░░░\nPower: █████\nRange: ███░░',
   special:'Quake Slam',sfx:'hammer'},
  {id:'viper',name:'VIPER',title:'The Shadow Dancer',
   body:'#008833',body2:'#33ff77',accent:'#00ffaa',glow:'#00ff66',
   weapon:'daggers',spd:7.0,pow:0.65,maxHp:82,
   desc:'Speed: █████\nPower: ██░░░\nRange: ██░░░',
   special:'Flurry',sfx:'daggers'},
  {id:'reaper',name:'REAPER',title:'The Soul Collector',
   body:'#660099',body2:'#cc44ff',accent:'#ff00ff',glow:'#aa00ff',
   weapon:'scythe',spd:4.2,pow:1.3,maxHp:92,
   desc:'Speed: ███░░\nPower: ████░\nRange: █████',
   special:'Soul Orb',sfx:'scythe'},
];

// ── STATE ───────────────────────────────────────────────────────────────────
const FLOOR=375, GRAVITY=0.72, JUMP_VY=-17, MAX_ROUND=60;
let mode='cpu', gameState='menu';
let p1,p2, round=1, wins=[0,0];
let roundTimer=MAX_ROUND, timerTick=0, frameCount=0;
let particles=[], hitTexts=[], trails=[], projectiles=[];
let shake=0, keys={};
let p1sel=null, p2sel=null;

// ── FIGHTER FACTORY ──────────────────────────────────────────────────────────
function makeFighter(charDef,x,facing){
  return {
    ...charDef,
    x, y:FLOOR, vx:0, vy:0,
    hp:charDef.maxHp,
    facing, // 1=right -1=left
    state:'idle', stateTimer:0,
    onGround:true, blocking:false,
    hitCd:0, specCd:0,
    atkBox:null,
    combo:0, comboTimer:0,
    cpuTimer:0, cpuIntent:'idle',
    weaponAngle:0, weaponTarget:0,
    trailBuf:[],
  };
}

// ── DRAW UTILS ───────────────────────────────────────────────────────────────
// Capsule shape path between two points
function cap(x1,y1,x2,y2,r){
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.beginPath();
  ctx.arc(x1,y1,r,a+Math.PI/2,a-Math.PI/2,true);
  ctx.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2,false);
  ctx.closePath();
}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.closePath();}

// ── POSE SKELETON ────────────────────────────────────────────────────────────
// Joint keys: h=head n=neck ch=chest pe=pelvis
//   fs/fe/fw = front(weapon) shoulder/elbow/wrist
//   bs/be/bw = back arm shoulder/elbow/wrist
//   fh/fk/fa = front leg hip/knee/ankle
//   bh/bk/ba = back leg hip/knee/ankle
// Local space: x * facing → world x offset; y added directly to f.y (negative = up)
const PK2=['h','n','ch','pe','fs','fe','fw','bs','be','bw','fh','fk','fa','bh','bk','ba'];
function mkP(a){const p={};PK2.forEach((k,i)=>p[k]=[a[i*2],a[i*2+1]]);return p;}
const POSES={
  idle:    mkP([0,-88, 0,-74, 0,-63, 0,-42,  11,-68, 15,-53, 11,-40, -11,-68,-15,-53,-11,-40,   7,-42, 9,-22, 10, 0,  -7,-42, -9,-22,-11, 0]),
  walk1:   mkP([2,-88, 1,-74, 0,-63, 0,-42,  13,-68,  9,-52,  5,-40, -13,-68, -9,-52, -5,-40,  10,-42,13,-22, 14, 0,  -8,-42, -5,-24,-10, 0]),
  walk2:   mkP([-2,-88,-1,-74, 0,-63, 0,-42,  12,-68, 17,-53, 13,-40, -12,-68,-17,-53,-13,-40,   6,-42, 4,-24,  7, 0,  -9,-42,-13,-22,-14, 0]),
  punch:   mkP([4,-88, 2,-74, 2,-63, 0,-42,  12,-67, 28,-61, 46,-56, -12,-68,-17,-56,-12,-46,   8,-42,10,-22, 10, 0,  -8,-42,-12,-22,-14, 0]),
  kick:    mkP([3,-88, 2,-74, 1,-63, 0,-42,  12,-68, 14,-55, 10,-42, -12,-68,-16,-55,-11,-42,  11,-42,28,-28, 42,-14, -8,-42,-10,-22,-10, 0]),
  block:   mkP([-2,-88,-1,-74,-1,-63, 0,-42,   8,-68,  4,-80, -2,-90,  -8,-68, -4,-78,  1,-86,   7,-42, 9,-22, 10, 0,  -7,-42, -9,-22,-11, 0]),
  special: mkP([2,-88, 1,-74, 2,-63, 0,-42,  12,-67, 28,-63, 44,-59, -10,-67,-22,-63,-10,-60,   8,-42,10,-22, 10, 0,  -8,-42,-12,-22,-14, 0]),
  hurt:    mkP([-6,-86,-4,-72,-3,-63, 0,-42,  -5,-66,-11,-52, -7,-40,   7,-66, 13,-52,  9,-40,   7,-42, 9,-22,  9, 0,  -7,-42, -9,-22, -9, 0]),
  jump:    mkP([0,-88, 0,-74, 0,-63, 0,-42,  13,-68, 19,-55, 15,-42, -13,-68,-19,-55,-15,-42,  10,-42,15,-28, 11,-8, -10,-42,-15,-28,-11,-8]),
  victory: mkP([0,-90, 0,-74, 0,-63, 0,-42,  12,-68, 16,-83, 10,-96, -12,-68,-16,-83,-10,-96,   7,-42, 9,-22, 10, 0,  -7,-42, -9,-22,-11, 0]),
  dead:    mkP([26,-16,18,-14, 8,-18, 0,-12,  14,-26, 26,-18, 36,-8,  -6,-24,-18,-18,-28, -8,   8,-12,24, -6, 36,-2,  -8,-12,-24, -6,-36,-2]),
};
function getJ(f,pk){
  const pose=POSES[pk]||POSES.idle, j={};
  const bob=f.state==='idle'?Math.sin(frameCount*0.05+(f.facing>0?0:Math.PI))*2:0;
  for(const [k,v] of Object.entries(pose)) j[k]=[f.x+v[0]*f.facing, f.y+v[1]+bob];
  return j;
}
function getPK(f){
  if(f.state==='walk') return Math.floor(frameCount/8)%2?'walk1':'walk2';
  return POSES[f.state]?f.state:'idle';
}
// Fake weaponInfo for trail compatibility
function weaponInfo(f){
  const j=getJ(f,getPK(f));
  const wx=j.fw[0],wy=j.fw[1],ex=j.fe[0],ey=j.fe[1];
  const dx=wx-ex,dy=wy-ey,len=Math.sqrt(dx*dx+dy*dy)||1;
  const reach={katana:86,hammer:28,daggers:50,scythe:80}[f.weapon]||60;
  return {tip:{x:wx+dx/len*reach,y:wy+dy/len*reach}};
}

// ── DRAW FIGHTER ─────────────────────────────────────────────────────────────
function drawFighter(f){
  if(f.state==='dead'&&f.stateTimer>60&&Math.floor(frameCount/6)%2===0) return;
  const j=getJ(f,getPK(f));
  const flash=f.hitCd>0&&Math.floor(frameCount/3)%2===0;
  const dead=f.state==='dead', special=f.state==='special';
  const C1=f.body,C2=f.body2,CA=f.accent;

  // Ground shadow
  if(!dead){
    ctx.fillStyle='rgba(0,0,0,0.28)';
    circ(f.x,FLOOR+5,22); ctx.fill();
  }

  ctx.save();
  if(flash) ctx.filter='brightness(7) saturate(0.2)';
  if(dead) ctx.globalAlpha=0.6;

  // ── BACK LEG (dimmed for depth) ──
  ctx.globalAlpha*=0.68;
  ctx.fillStyle=C1;
  cap(j.bh[0],j.bh[1],j.bk[0],j.bk[1],8); ctx.fill();
  cap(j.bk[0],j.bk[1],j.ba[0],j.ba[1],7.5); ctx.fill();
  // knee cap back
  ctx.fillStyle=CA+'44'; circ(j.bk[0],j.bk[1],7); ctx.fill();
  // back boot
  ctx.fillStyle='#2a2020';
  ctx.beginPath();ctx.ellipse(j.ba[0]+f.facing*5,j.ba[1]-3,10,5.5,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=dead?0.6:1;

  // ── BACK ARM (dimmed) ──
  ctx.globalAlpha*=0.68;
  ctx.fillStyle=C2;
  cap(j.bs[0],j.bs[1],j.be[0],j.be[1],6.5); ctx.fill();
  cap(j.be[0],j.be[1],j.bw[0],j.bw[1],5.5); ctx.fill();
  ctx.fillStyle=C2; circ(j.bw[0],j.bw[1],7); ctx.fill();
  ctx.globalAlpha=dead?0.6:1;

  // ── TORSO ──
  // Neck
  ctx.fillStyle=C2; cap(j.n[0],j.n[1],j.ch[0],j.ch[1]-6,5.5); ctx.fill();
  // Torso body as polygon (tapered shape)
  const tg=ctx.createLinearGradient(j.ch[0],j.ch[1],j.pe[0],j.pe[1]);
  tg.addColorStop(0,C2); tg.addColorStop(1,C1);
  ctx.fillStyle=tg;
  ctx.beginPath();
  ctx.moveTo(j.bs[0],j.bs[1]);
  ctx.quadraticCurveTo(j.bs[0]+f.facing*-2,j.ch[1]+4,j.bh[0]+f.facing*3,j.bh[1]);
  ctx.lineTo(j.fh[0]-f.facing*3,j.fh[1]);
  ctx.quadraticCurveTo(j.fs[0]+f.facing*2,j.ch[1]+4,j.fs[0],j.fs[1]);
  ctx.closePath(); ctx.fill();
  // Chest center stripe
  ctx.fillStyle=CA+'33';
  cap(j.ch[0],j.ch[1],j.pe[0],j.pe[1],3.5); ctx.fill();
  // Shoulder armor pads
  ctx.shadowColor=CA; ctx.shadowBlur=5;
  ctx.fillStyle=CA+'88'; circ(j.fs[0],j.fs[1],10); ctx.fill();
  ctx.globalAlpha*=0.65; circ(j.bs[0],j.bs[1],9); ctx.fill();
  ctx.globalAlpha=dead?0.6:1; ctx.shadowBlur=0;
  // Belt buckle
  ctx.fillStyle='#181418'; cap(j.pe[0]-8,j.pe[1],j.pe[0]+8,j.pe[1],5); ctx.fill();
  ctx.fillStyle=CA; circ(j.pe[0],j.pe[1],4); ctx.fill();

  // ── FRONT LEG ──
  ctx.fillStyle=C1;
  cap(j.fh[0],j.fh[1],j.fk[0],j.fk[1],9); ctx.fill();
  cap(j.fk[0],j.fk[1],j.fa[0],j.fa[1],7.5); ctx.fill();
  // Knee guard
  ctx.fillStyle=CA+'55'; circ(j.fk[0],j.fk[1],8); ctx.fill();
  // Front boot with toe detail
  ctx.fillStyle='#333';
  ctx.beginPath();ctx.ellipse(j.fa[0]+f.facing*5,j.fa[1]-3,12,6,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=CA+'66';
  ctx.beginPath();ctx.ellipse(j.fa[0]+f.facing*7,j.fa[1]-5,5,3,0,0,Math.PI*2);ctx.fill();

  // ── HEAD ──
  drawHead(f,j,C1,C2,CA);

  // ── FRONT ARM ──
  ctx.fillStyle=C2;
  cap(j.fs[0],j.fs[1],j.fe[0],j.fe[1],7); ctx.fill();
  // elbow guard
  ctx.fillStyle=CA+'55'; circ(j.fe[0],j.fe[1],6.5); ctx.fill();
  ctx.fillStyle=C2;
  cap(j.fe[0],j.fe[1],j.fw[0],j.fw[1],5.5); ctx.fill();
  // Gauntlet / fist
  if(special){ctx.shadowColor=CA;ctx.shadowBlur=22;}
  ctx.fillStyle=special?CA:C2; circ(j.fw[0],j.fw[1],8.5); ctx.fill();
  ctx.strokeStyle=CA+'66'; ctx.lineWidth=2; circ(j.fw[0],j.fw[1],8.5); ctx.stroke();
  ctx.shadowBlur=0;

  ctx.restore();

  // Name
  ctx.fillStyle='#ffffff44'; ctx.font='bold 9px Courier New'; ctx.textAlign='center';
  ctx.fillText(f.name,f.x,f.y-112);
  ctx.textAlign='left';

  // Weapon drawn on top
  if(f.state!=='dead') drawWeaponAt(f,j);
}

function drawHead(f,j,C1,C2,CA){
  const hx=j.h[0],hy=j.h[1],dir=f.facing;
  // Head sphere with radial gradient
  const hg=ctx.createRadialGradient(hx-dir*3,hy-3,2,hx,hy,15);
  hg.addColorStop(0,C2); hg.addColorStop(1,C1);
  ctx.fillStyle=hg; circ(hx,hy,14); ctx.fill();
  // Helmet top half
  ctx.fillStyle=CA; ctx.shadowColor=CA; ctx.shadowBlur=7;
  ctx.beginPath(); ctx.arc(hx,hy,14,Math.PI,0); ctx.closePath(); ctx.fill();
  ctx.shadowBlur=0;
  // Visor bar
  ctx.fillStyle='#000a'; ctx.fillRect(hx-13,hy-1,26,7);
  ctx.strokeStyle=CA+'cc'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(hx-13,hy); ctx.lineTo(hx+13,hy); ctx.stroke();
  // Glowing eyes
  const ex=hx+dir*3;
  ctx.fillStyle=f.glow; ctx.shadowColor=f.glow; ctx.shadowBlur=14;
  ctx.beginPath(); ctx.ellipse(ex,hy+3,4,2.5,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // Cheek plates
  ctx.fillStyle=CA+'77';
  ctx.fillRect(hx-14,hy+2,4,8); ctx.fillRect(hx+10,hy+2,4,8);
  // Chin and jaw
  ctx.fillStyle=C1+'cc';
  ctx.beginPath(); ctx.ellipse(hx,hy+12,9,5,0,0,Math.PI*2); ctx.fill();
  // Mouth expression
  ctx.strokeStyle='#000a'; ctx.lineWidth=1.5;
  ctx.beginPath();
  if(f.state==='hurt'||f.state==='dead'){ctx.arc(hx+dir,hy+9,3.5,0,Math.PI);}
  else if(f.state==='victory'){ctx.arc(hx+dir,hy+8,3,Math.PI*1.15,Math.PI*1.85);}
  else{ctx.moveTo(hx+dir-3,hy+9);ctx.lineTo(hx+dir+3,hy+9);}
  ctx.stroke();
}

// ── WEAPON DRAWING (joint-anchored) ─────────────────────────────────────────
function drawWeaponAt(f,j){
  const wx=j.fw[0],wy=j.fw[1],ex=j.fe[0],ey=j.fe[1];
  const dx=wx-ex,dy=wy-ey,len=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/len,uy=dy/len,px=-uy,py=ux;
  const swing=['punch','kick','special'].includes(f.state);
  ctx.save();
  if(swing){ctx.shadowColor=f.glow;ctx.shadowBlur=18;}

  if(f.weapon==='katana'){
    // Handle (behind wrist toward elbow)
    const h0x=wx-ux*5,h0y=wy-uy*5, h1x=wx+ux*22,h1y=wy+uy*22;
    ctx.fillStyle='#2a1505'; cap(h0x,h0y,h1x,h1y,3.5); ctx.fill();
    // Leather wrap
    ctx.strokeStyle='#8b0000'; ctx.lineWidth=3;
    for(let i=0;i<4;i++){const t=i/3.5,bx=h0x+(h1x-h0x)*t,by=h0y+(h1y-h0y)*t;ctx.beginPath();ctx.moveTo(bx+px*3.5,by+py*3.5);ctx.lineTo(bx-px*3.5,by-py*3.5);ctx.stroke();}
    // Guard
    ctx.fillStyle='#888'; cap(h1x+px*9,h1y+py*9,h1x-px*9,h1y-py*9,3); ctx.fill();
    ctx.fillStyle='#aaa'; cap(h1x+px*8,h1y+py*8,h1x-px*8,h1y-py*8,2); ctx.fill();
    // Blade (tapered)
    const tipx=wx+ux*88,tipy=wy+uy*88;
    const bg=ctx.createLinearGradient(h1x,h1y,tipx,tipy);
    bg.addColorStop(0,'#d8d8d8'); bg.addColorStop(0.65,'#ffffff'); bg.addColorStop(1,'#aaccff');
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.moveTo(h1x+px*3.2,h1y+py*3.2); ctx.lineTo(h1x-px*3.2,h1y-py*3.2);
    ctx.lineTo(tipx+px*0.5,tipy+py*0.5); ctx.lineTo(tipx,tipy); ctx.closePath(); ctx.fill();
    if(swing){ctx.strokeStyle=f.accent+'99';ctx.lineWidth=1;ctx.stroke();}
    // Blood groove
    ctx.strokeStyle='#aaaadd55'; ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(h1x,h1y);ctx.lineTo(tipx-ux*8,tipy-uy*8);ctx.stroke();

  }else if(f.weapon==='hammer'){
    // Both hands grip - use front and back wrist
    const bwx=j.bw[0],bwy=j.bw[1];
    // Handle between wrists
    ctx.fillStyle='#5a3810'; cap(wx-ux*6,wy-uy*6,bwx+0,bwy+0,4.5); ctx.fill();
    ctx.strokeStyle='#888'; ctx.lineWidth=2.5;
    [0.3,0.65].forEach(t=>{const bx=wx+(bwx-wx)*t,by=wy+(bwy-wy)*t;ctx.beginPath();ctx.moveTo(bx+px*5,by+py*5);ctx.lineTo(bx-px*5,by-py*5);ctx.stroke();});
    // Hammer head perpendicular at front wrist
    const hg=ctx.createLinearGradient(wx+px*22,wy+py*22,wx-px*22,wy-py*22);
    hg.addColorStop(0,'#3a3a3a'); hg.addColorStop(0.4,'#aaaaaa'); hg.addColorStop(1,'#2a2a2a');
    ctx.fillStyle=hg;
    cap(wx+ux*16+px*22,wy+uy*16+py*22,wx-ux*16+px*22,wy-uy*16+py*22,14); ctx.fill();
    // Edge highlight
    ctx.strokeStyle='#ccc8'; ctx.lineWidth=2;
    cap(wx+ux*16+px*22,wy+uy*16+py*22,wx-ux*16+px*22,wy-uy*16+py*22,14); ctx.stroke();
    // Rivets
    ctx.fillStyle='#ddd';
    [[-10,0],[0,0],[10,0]].forEach(([ox])=>{circ(wx+ux*ox+px*22,wy+uy*ox+py*22,3);ctx.fill();});
    if(swing){ctx.strokeStyle=f.accent;ctx.lineWidth=2.5;
    cap(wx+ux*16+px*22,wy+uy*16+py*22,wx-ux*16+px*22,wy-uy*16+py*22,14); ctx.stroke();}

  }else if(f.weapon==='daggers'){
    drawDagger(wx,wy,ux,uy,px,py,f,swing);
    const bwx=j.bw[0],bwy=j.bw[1],bdx=bwx-j.be[0],bdy=bwy-j.be[1];
    const bl=Math.sqrt(bdx*bdx+bdy*bdy)||1,bux=bdx/bl,buy=bdy/bl,bpx=-buy,bpy=bux;
    drawDagger(bwx,bwy,bux,buy,bpx,bpy,f,false);

  }else{ // scythe
    // Pole: from wrist, extends upward-backward using perpendicular
    const tipx=wx-ux*12+py*82,tipy=wy-uy*12-px*82;
    const pg=ctx.createLinearGradient(wx,wy,tipx,tipy);
    pg.addColorStop(0,'#1a1828'); pg.addColorStop(1,'#3a384a');
    ctx.fillStyle=pg; cap(wx,wy,tipx,tipy,3.5); ctx.fill();
    // Curved blade at pole tip
    const sg=ctx.createLinearGradient(tipx,tipy,tipx+f.facing*70,tipy-28);
    sg.addColorStop(0,'#330044'); sg.addColorStop(0.45,'#9900bb'); sg.addColorStop(1,'#ff44ee');
    ctx.fillStyle=sg;
    ctx.beginPath();
    ctx.moveTo(tipx,tipy);
    ctx.bezierCurveTo(tipx+f.facing*22,tipy-15,tipx+f.facing*58,tipy-30,tipx+f.facing*74,tipy-20);
    ctx.bezierCurveTo(tipx+f.facing*58,tipy-8,tipx+f.facing*26,tipy+10,tipx+f.facing*6,tipy+13);
    ctx.closePath(); ctx.fill();
    // Inner highlight
    ctx.strokeStyle=f.accent+'66'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(tipx+f.facing*4,tipy+4);
    ctx.bezierCurveTo(tipx+f.facing*20,tipy-10,tipx+f.facing*52,tipy-24,tipx+f.facing*68,tipy-16);
    ctx.stroke();
    if(swing){ctx.strokeStyle=f.accent+'aa';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(tipx,tipy);ctx.bezierCurveTo(tipx+f.facing*22,tipy-15,tipx+f.facing*58,tipy-30,tipx+f.facing*74,tipy-20);ctx.bezierCurveTo(tipx+f.facing*58,tipy-8,tipx+f.facing*26,tipy+10,tipx+f.facing*6,tipy+13);ctx.closePath();ctx.stroke();}
  }
  ctx.restore();
}

function drawDagger(wx,wy,ux,uy,px,py,f,swing){
  ctx.fillStyle='#1a1520'; cap(wx,wy,wx+ux*18,wy+uy*18,3.2); ctx.fill();
  // wrap
  ctx.strokeStyle='#555'; ctx.lineWidth=2;
  for(let i=0;i<3;i++){const t=i/2.5,bx=wx+ux*18*t,by=wy+uy*18*t;ctx.beginPath();ctx.moveTo(bx+px*3,by+py*3);ctx.lineTo(bx-px*3,by-py*3);ctx.stroke();}
  // Crossguard
  ctx.fillStyle='#666'; cap(wx+ux*16-px*7,wy+uy*16-py*7,wx+ux*16+px*7,wy+uy*16+py*7,2.8); ctx.fill();
  // Blade
  const tipx=wx+ux*52,tipy=wy+uy*52;
  const dg=ctx.createLinearGradient(wx+ux*18,wy+uy*18,tipx,tipy);
  dg.addColorStop(0,'#bbb'); dg.addColorStop(1,'#d8ffda');
  ctx.fillStyle=dg;
  ctx.beginPath();
  ctx.moveTo(wx+ux*18+px*2.8,wy+uy*18+py*2.8);
  ctx.lineTo(wx+ux*18-px*2.8,wy+uy*18-py*2.8);
  ctx.lineTo(tipx,tipy); ctx.closePath(); ctx.fill();
  if(swing){ctx.strokeStyle=f.accent+'aa';ctx.lineWidth=1;ctx.stroke();}
}

// ── WEAPON TRAIL ─────────────────────────────────────────────────────────────
function updateTrail(f){
  const swing=['punch','kick','special'].includes(f.state);
  if(swing){
    const wi=weaponInfo(f);
    f.trailBuf.push({x:wi.tip.x,y:wi.tip.y});
  } else { f.trailBuf=[]; }
  if(f.trailBuf.length>12)f.trailBuf.shift();
}

function drawTrail(f){
  if(f.trailBuf.length<2)return;
  ctx.save();
  for(let i=1;i<f.trailBuf.length;i++){
    const a=i/f.trailBuf.length;
    ctx.strokeStyle=f.accent;ctx.globalAlpha=a*0.55;ctx.lineWidth=a*7;
    ctx.shadowColor=f.glow;ctx.shadowBlur=16*a;
    ctx.beginPath();
    ctx.moveTo(f.trailBuf[i-1].x,f.trailBuf[i-1].y);
    ctx.lineTo(f.trailBuf[i].x,f.trailBuf[i].y);
    ctx.stroke();
  }
  ctx.restore();
}

// ── BACKGROUND ───────────────────────────────────────────────────────────────
function drawBG(){
  // Sky

  sky.addColorStop(0,'#03000f');sky.addColorStop(0.6,'#0d0020');sky.addColorStop(1,'#1a0030');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Moon
  ctx.save();
  ctx.shadowColor='#ffe0a0';ctx.shadowBlur=40;
  ctx.fillStyle='#ffe8c0';ctx.beginPath();ctx.arc(700,55,38,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0d0020';ctx.beginPath();ctx.arc(714,46,32,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Stars
  ctx.save();
  for(let i=0;i<70;i++){
    const sx=(i*191+37)%W, sy=(i*113)%(FLOOR-20);
    const br=Math.sin(frameCount*.04+i)*.3+.7;
    ctx.fillStyle=`rgba(255,255,255,${br*.55})`;

  // Distant mountains
  ctx.fillStyle='#0a001a';
  ctx.beginPath();ctx.moveTo(0,FLOOR);
  [0,60,120,200,280,360,440,520,600,680,760,800].forEach((x,i)=>{
    const h=80+Math.sin(i*1.3)*40;ctx.lineTo(x,FLOOR-h);
  });
  ctx.lineTo(800,FLOOR);ctx.closePath();ctx.fill();

  // Temple columns
  ctx.fillStyle='#110022';
  for(let i=0;i<7;i++){
    const px=i*130-10;
    // column body
    const cg=ctx.createLinearGradient(px,0,px+28,0);
    cg.addColorStop(0,'#1a0030');cg.addColorStop(0.5,'#2a0050');cg.addColorStop(1,'#150025');
    ctx.fillStyle=cg;ctx.fillRect(px,130,28,FLOOR-130);
    // capital
    ctx.fillStyle='#2a0044';ctx.fillRect(px-6,124,40,14);
    ctx.fillRect(px-3,118,34,10);
    // torch flame
    if(i%2===0){
      const fl=Math.sin(frameCount*.15+i)*.3+.7;
      ctx.save();ctx.shadowColor='#ff8800';ctx.shadowBlur=20*fl;
      ctx.fillStyle=`rgba(255,${140+60*fl|0},0,${fl})`;
      ctx.beginPath();ctx.ellipse(px+14,112,4,8*fl,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(255,220,0,${fl*.7})`;
      ctx.beginPath();ctx.ellipse(px+14,114,2.5,5*fl,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  // Floor
  const fg=ctx.createLinearGradient(0,FLOOR,0,H);
  fg.addColorStop(0,'#22004a');fg.addColorStop(1,'#0a0015');
  ctx.fillStyle=fg;ctx.fillRect(0,FLOOR,W,H-FLOOR);

  // Floor tiles
  ctx.strokeStyle='#3a0066';ctx.lineWidth=1;
  for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,FLOOR);ctx.lineTo(x,H);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,FLOOR+40);ctx.lineTo(W,FLOOR+40);ctx.stroke();

  // Floor glow line
  ctx.save();ctx.shadowColor='#8833cc';ctx.shadowBlur=20;
  ctx.strokeStyle='#aa44ff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();
  ctx.restore();

  // Reflection on floor (fighters' colors)
  [p1,p2].forEach(f=>{
    if(!f||f.state==='dead')return;
    const rg=ctx.createLinearGradient(f.x-30,FLOOR,f.x+30,FLOOR+50);
    rg.addColorStop(0,f.glow+'44');rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg;ctx.fillRect(f.x-30,FLOOR,60,50);
  });
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
function spawnHit(x,y,color,glow,n=12){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*5+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,color,glow,life:22+Math.random()*18,max:40,r:Math.random()*3+1});
  }
}
function spawnSpecial(x,y,f){
  for(let i=0;i<20;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*6+2;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,color:f.accent,glow:f.glow,life:30+Math.random()*25,max:55,r:Math.random()*4+1.5});
  }
}
function spawnBlock(x,y){
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2,s=Math.random()*3+1;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,color:'#88aaff',glow:'#4488ff',life:18,max:18,r:2});
  }
}

function drawParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.18;p.life--;
    const a=p.life/p.max;
    ctx.save();ctx.globalAlpha=a;ctx.shadowColor=p.glow||p.color;ctx.shadowBlur=8;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*a,0,Math.PI*2);ctx.fill();
    ctx.restore();
    return p.life>0;
  });
}

function drawHitTexts(){
  hitTexts=hitTexts.filter(t=>{
    t.y-=.8;t.life--;const a=t.life/t.max;
    ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';
    ctx.font='bold '+t.size+'px Courier New';
    ctx.shadowColor=t.color;ctx.shadowBlur=12;ctx.fillStyle=t.color;
    ctx.fillText(t.text,t.x,t.y);ctx.restore();
    return t.life>0;
  });
}

function showHit(x,y,text,color,size=14){
  hitTexts.push({x,y,text,color,size,life:50,max:50});
}

// ── PROJECTILES (scythe orb) ─────────────────────────────────────────────────
function drawProjectiles(){
  projectiles=projectiles.filter(pr=>{
    pr.x+=pr.vx;pr.life--;
    if(pr.x<0||pr.x>W||pr.life<=0)return false;
    ctx.save();ctx.shadowColor=pr.color;ctx.shadowBlur=20;
    ctx.fillStyle=pr.color;ctx.beginPath();ctx.arc(pr.x,pr.y,10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pr.x,pr.y,4,0,Math.PI*2);ctx.fill();
    ctx.restore();
    spawnHit(pr.x,pr.y,pr.color,pr.color,1);
    // Check hit
    const target=pr.owner===p1?p2:p1;
    if(!target.blocking&&Math.abs(pr.x-target.x)<28&&Math.abs(pr.y-target.y)<50){
      applyDmg(pr.owner,target,28,'special');
      return false;
    }
    return true;
  });
}

// ── COMBAT ───────────────────────────────────────────────────────────────────
function atkBoxFor(f,type){
  const reach={punch:68,kick:80,special:110}[type]||70;
  const yOff={punch:-58,kick:-38,special:-54}[type]||-55;
  const h={punch:28,kick:32,special:36}[type]||28;
  return {x:f.x+(f.facing>0?0:-reach),y:f.y+yOff,w:reach,h,type,life:{punch:9,kick:11,special:14}[type]||9};
}

function applyDmg(atk,def,dmg,type){
  if(def.hitCd>0)return;
  const realDmg=dmg*atk.pow*(def.blocking&&def.facing!==atk.facing?0:1);
  if(def.blocking&&def.facing!==atk.facing){
    sfx.block();spawnBlock(def.x,def.y-50);showHit(def.x,def.y-70,'BLOCKED','#88aaff');
    def.hitCd=18;return;
  }
  def.hp=Math.max(0,def.hp-realDmg);def.hitCd=26;
  atk.combo++;atk.comboTimer=90;
  shake=type==='special'?8:type==='kick'?4:2;
  const sfxFn={punch:sfx.punch,kick:sfx.kick,special:sfx.special,sword:sfx.sword,hammer:sfx.hammer,daggers:sfx.daggers,scythe:sfx.scythe}[atk.sfx]||sfx.punch;
  sfxFn();spawnHit(def.x,def.y-50,def.glow,def.glow);
  const labels={punch:'HIT!',kick:'KICK!',special:'SPECIAL!'};
  const colors={punch:'#ffcc00',kick:'#ff8800',special:'#ff00ff'};
  showHit(def.x,def.y-78,labels[type]||'HIT!',colors[type]||'#ff0',type==='special'?18:14);
  if(atk.combo>=3)showHit(atk.x,atk.y-100,atk.combo+' HIT COMBO!','#00ffff',16);
  def.state='hurt';def.stateTimer=type==='special'?32:20;
  def.vx=atk.facing*(type==='special'?7:3);
  if(type==='special')def.vy=-6;
}

function checkAtk(atk,def){
  if(!atk.atkBox)return;
  const b=atk.atkBox;
  if(b.x<def.x+26&&b.x+b.w>def.x-26&&b.y<def.y&&b.y+b.h>def.y-90){
    applyDmg(atk,def,{punch:9,kick:13,special:24}[b.type]||9,b.type);
    atk.atkBox=null;
  }
}

// ── INPUT ────────────────────────────────────────────────────────────────────
function handleInput(f,isP1){
  if(['dead','victory'].includes(f.state))return;
  // P1: Arrow keys + ZXCV  |  P2: WASD + UIOJ
  const L=isP1?keys['ArrowLeft']:(keys['a']||keys['A']);
  const R=isP1?keys['ArrowRight']:(keys['d']||keys['D']);
  const J=isP1?keys['ArrowUp']:(keys['w']||keys['W']);
  const P=isP1?(keys['z']||keys['Z']):(keys['u']||keys['U']);
  const K=isP1?(keys['x']||keys['X']):(keys['i']||keys['I']);
  const B=isP1?(keys['c']||keys['C']):(keys['o']||keys['O']);
  const S=isP1?(keys['v']||keys['V']):(keys['j']||keys['J']);

  f.blocking=false;
  if(['punch','kick','special','hurt'].includes(f.state)){f.stateTimer--;if(f.stateTimer<=0)f.state='idle';return;}
  if(B){f.blocking=true;f.state='block';f.vx=0;return;}
  if(S&&f.specCd<=0){doSpecial(f);return;}
  if(P){f.state='punch';f.stateTimer=15;f.atkBox=atkBoxFor(f,'punch');return;}
  if(K){f.state='kick'; f.stateTimer=19;f.atkBox=atkBoxFor(f,'kick'); return;}
  if(J&&f.onGround){f.vy=JUMP_VY;f.onGround=false;f.state='jump';}
  f.vx=L?-f.spd:R?f.spd:0;
  if(f.onGround&&f.state!=='jump')f.state=f.vx!==0?'walk':'idle';
}

function doSpecial(f){
  f.state='special';f.stateTimer=30;f.specCd=180;
  spawnSpecial(f.x,f.y-50,f);
  if(f.weapon==='scythe'){
    projectiles.push({x:f.x+f.facing*20,y:f.y-52,vx:f.facing*8,color:f.accent,owner:f,life:120});
  } else {
    f.atkBox=atkBoxFor(f,'special');
  }
  if(f.weapon==='hammer'){shake=12;}
}

// ── CPU AI ───────────────────────────────────────────────────────────────────
function cpuAI(cpu,opp){
  if(['dead','victory'].includes(cpu.state))return;
  if(cpu.state==='hurt'){if(--cpu.stateTimer<=0)cpu.state='idle';return;}
  if(cpu.state==='block'){cpu.blocking=true;if(--cpu.cpuTimer<=0){cpu.state='idle';cpu.blocking=false;}return;}
  cpu.blocking=false;
  if(['punch','kick','special'].includes(cpu.state)){if(--cpu.stateTimer<=0)cpu.state='idle';return;}
  cpu.cpuTimer--;const dx=opp.x-cpu.x,dist=Math.abs(dx);
  if(cpu.cpuTimer>0){
    if(cpu.cpuIntent==='approach'){cpu.vx=Math.sign(dx)*cpu.spd;cpu.state='walk';}
    else if(cpu.cpuIntent==='retreat'){cpu.vx=-Math.sign(dx)*cpu.spd;cpu.state='walk';}
    else{cpu.vx=0;if(cpu.state==='walk')cpu.state='idle';}
    return;
  }
  cpu.vx=0;const r=Math.random();
  if(dist>180){cpu.cpuIntent='approach';cpu.cpuTimer=15+Math.random()*10|0;}
  else if(dist<65){
    if(r<.10&&cpu.specCd<=0)doSpecial(cpu);
    else if(r<.38){cpu.state='punch';cpu.stateTimer=15;cpu.atkBox=atkBoxFor(cpu,'punch');}
    else if(r<.60){cpu.state='kick';cpu.stateTimer=19;cpu.atkBox=atkBoxFor(cpu,'kick');}
    else if(r<.72){cpu.blocking=true;cpu.state='block';cpu.cpuTimer=12+Math.random()*10|0;cpu.cpuIntent='block';}
    else{cpu.cpuIntent='retreat';cpu.cpuTimer=10;}
  } else {
    if(r<.08&&cpu.specCd<=0)doSpecial(cpu);
    else if(r<.30){cpu.state='kick';cpu.stateTimer=19;cpu.atkBox=atkBoxFor(cpu,'kick');}
    else if(r<.42&&cpu.onGround){cpu.vy=JUMP_VY;cpu.onGround=false;cpu.state='jump';cpu.cpuTimer=8;}
    else{cpu.cpuIntent='approach';cpu.cpuTimer=12;}
  }
}

// ── PHYSICS ──────────────────────────────────────────────────────────────────
function physics(f){
  if(f.state==='dead'&&!f.onGround){}
  f.x+=f.vx;f.vy+=GRAVITY;f.y+=f.vy;
  if(f.y>=FLOOR){f.y=FLOOR;f.vy=0;f.onGround=true;if(f.state==='jump')f.state='idle';}
  f.x=Math.max(30,Math.min(W-30,f.x));
  if(f.hitCd>0)f.hitCd--;if(f.specCd>0)f.specCd--;
  if(f.comboTimer>0){f.comboTimer--;if(!f.comboTimer)f.combo=0;}
  if(f.atkBox){f.atkBox.life--;if(f.atkBox.life<=0)f.atkBox=null;}
}

function faceEach(){
  if(!['punch','kick','special','hurt','dead','victory'].includes(p1.state))p1.facing=p1.x<p2.x?1:-1;
  if(!['punch','kick','special','hurt','dead','victory'].includes(p2.state))p2.facing=p2.x<p1.x?1:-1;
  // push apart - dir moves p1 away from p2
  if(Math.abs(p1.x-p2.x)<52){
    const push=(52-Math.abs(p1.x-p2.x))/2;
    const dir=Math.sign(p1.x-p2.x)||1;
    p1.x=Math.max(30,Math.min(W-30,p1.x+dir*push));
    p2.x=Math.max(30,Math.min(W-30,p2.x-dir*push));
  }
}

// ── MAIN UPDATE ──────────────────────────────────────────────────────────────
function update(){
  frameCount++;
  if(gameState!=='fight')return;
  if(shake>0)shake=Math.max(0,shake-0.8);
  timerTick++;if(timerTick>=60){timerTick=0;roundTimer--;}
  if(roundTimer<=0){endRound(true);return;}
  handleInput(p1,true);
  if(mode==='cpu')cpuAI(p2,p1);else handleInput(p2,false);
  physics(p1);physics(p2);faceEach();
  checkAtk(p1,p2);checkAtk(p2,p1);
  updateTrail(p1);updateTrail(p2);
  if(p1.hp<=0&&p1.state!=='dead'){p1.state='dead';p1.stateTimer=999;endRound(false);return;}
  if(p2.hp<=0&&p2.state!=='dead'){p2.state='dead';p2.stateTimer=999;endRound(false);return;}
  if(Math.max(...[p1,p2].map(f=>f.y-90))>FLOOR+20&&[p1,p2].every(f=>f.state!=='dead')){
    // someone reached bottom (shouldn't normally happen)
  }
}

// ── DRAW ─────────────────────────────────────────────────────────────────────
function draw(){
  ctx.save();
  if(shake>0){ctx.translate(Math.random()*shake*2-shake,Math.random()*shake*2-shake);}
  drawBG();
  drawTrail(p1);drawTrail(p2);
  drawFighter(p1);drawFighter(p2);
  drawProjectiles();
  drawParticles();
  drawHitTexts();
  drawHUD();
  ctx.restore();
}

// ── GAME FLOW ─────────────────────────────────────────────────────────────────
function showBanner(text,dur=1400){
  const el=document.getElementById('banner'),tx=document.getElementById('banner-text');
  tx.textContent=text;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}

function endRound(timeout){
  gameState='roundover';
  let winner=null;
  if(timeout){if(p1.hp>p2.hp)winner=0;else if(p2.hp>p1.hp)winner=1;}
  else{winner=p1.hp>0?0:1;}
  if(winner!==null){
    wins[winner]++;
    const wf=winner===0?p1:p2, lf=winner===0?p2:p1;
    wf.state='victory';lf.state='dead';
    if(lf.hp<=6){sfx.finish();showBanner('FINISH HIM!',2200);}
    else{sfx.round();showBanner(wf.name+' WINS!',2200);}
  } else showBanner('DRAW!',2200);
  setTimeout(()=>{
    if(wins[0]>=2||wins[1]>=2)showGameOver();
    else{round++;startFight();}
  },2500);
}

function startFight(){
  p1=makeFighter(CHARS.find(c=>c.id===p1sel),160,1);
  p2=makeFighter(CHARS.find(c=>c.id===p2sel),640,-1);
  roundTimer=MAX_ROUND;timerTick=0;particles=[];hitTexts=[];trails=[];projectiles=[];
  gameState='fight';sfx.round();showBanner('ROUND '+round,1000);
}

function showGameOver(){
  const winner=wins[0]>=2?p1:p2;
  gameState='gameover';
  const scr=document.getElementById('scr-over');
  scr.innerHTML=`<h1 style="font-size:34px;color:${winner.glow};text-shadow:0 0 30px ${winner.glow}">${winner.name}</h1>
  <h2 style="color:#f80;margin-bottom:6px">CHAMPION!</h2>
  <p style="color:#555;font-size:12px;margin-bottom:30px">Score: ${wins[0]} – ${wins[1]}</p>
  <div style="display:flex;gap:14px">
    <button class="btn" id="btn-rematch">REMATCH</button>
    <button class="btn" id="btn-sel">SELECT</button>
    <button class="btn" id="btn-menu2">MENU</button>
  </div>`;
  scr.classList.add('show');ui.classList.add('active');
  document.getElementById('btn-rematch').onclick=()=>{wins=[0,0];round=1;hideAllScreens();startFight();};
  document.getElementById('btn-sel').onclick=()=>{wins=[0,0];round=1;hideAllScreens();showSelect();};
  document.getElementById('btn-menu2').onclick=()=>{wins=[0,0];round=1;hideAllScreens();showMenu();};
}

function hideAllScreens(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  ui.classList.remove('active');
}

// ── CHARACTER SELECT ──────────────────────────────────────────────────────────
function drawCharPreview(charDef,canvas){
  const c2=canvas.getContext('2d');
  const cw=canvas.width, ch2=canvas.height;
  c2.clearRect(0,0,cw,ch2);
  const bg=c2.createLinearGradient(0,0,0,ch2);
  bg.addColorStop(0,'#080012');bg.addColorStop(1,'#160028');
  c2.fillStyle=bg;c2.fillRect(0,0,cw,ch2);
  c2.strokeStyle=charDef.glow+'33';c2.lineWidth=1;c2.strokeRect(0,0,cw,ch2);

  const cx=cw/2, fy=ch2-6;
  const C1=charDef.body,C2=charDef.body2,CA=charDef.accent;

  function c2cap(x1,y1,x2,y2,r){
    const a=Math.atan2(y2-y1,x2-x1);
    c2.beginPath();c2.arc(x1,y1,r,a+Math.PI/2,a-Math.PI/2,true);c2.arc(x2,y2,r,a-Math.PI/2,a+Math.PI/2,false);c2.closePath();
  }
  function c2circ(x,y,r){c2.beginPath();c2.arc(x,y,r,0,Math.PI*2);c2.closePath();}

  // Shadow
  c2.fillStyle='rgba(0,0,0,0.35)';c2circ(cx,fy-3,16);c2.fill();

  // Back leg
  c2.globalAlpha=0.55; c2.fillStyle=C1;
  c2cap(cx+4,fy-28,cx+6,fy-14,6.5);c2.fill();c2cap(cx+6,fy-14,cx+7,fy,5.5);c2.fill();
  c2.fillStyle='#2a2020';c2.beginPath();c2.ellipse(cx+10,fy-3,8,4.5,0,0,Math.PI*2);c2.fill();
  c2.globalAlpha=1;

  // Back arm
  c2.globalAlpha=0.55; c2.fillStyle=C2;
  c2cap(cx+8,fy-48,cx+14,fy-36,5);c2.fill();c2cap(cx+14,fy-36,cx+10,fy-26,4.5);c2.fill();
  c2.globalAlpha=1;

  // Torso
  c2.fillStyle=C2;c2cap(cx,fy-54,cx,fy-48,4.5);c2.fill(); // neck
  const tg=c2.createLinearGradient(cx,fy-50,cx,fy-28);
  tg.addColorStop(0,C2);tg.addColorStop(1,C1);
  c2.fillStyle=tg;
  c2.beginPath();c2.moveTo(cx-10,fy-48);c2.quadraticCurveTo(cx-12,fy-38,cx-8,fy-28);c2.lineTo(cx+7,fy-28);c2.quadraticCurveTo(cx+12,fy-38,cx+10,fy-48);c2.closePath();c2.fill();
  c2.fillStyle=CA+'55';c2cap(cx,fy-48,cx,fy-28,3);c2.fill(); // stripe
  // shoulder pads
  c2.shadowColor=CA;c2.shadowBlur=4;
  c2.fillStyle=CA+'88';c2circ(cx+10,fy-48,8);c2.fill();
  c2.globalAlpha=0.5;c2circ(cx-10,fy-48,7);c2.fill();c2.globalAlpha=1;c2.shadowBlur=0;
  // belt
  c2.fillStyle='#181418';c2cap(cx-6,fy-28,cx+6,fy-28,4);c2.fill();
  c2.fillStyle=CA;c2circ(cx,fy-28,3);c2.fill();

  // Front leg
  c2.fillStyle=C1;
  c2cap(cx-4,fy-28,cx-7,fy-14,7.5);c2.fill();c2cap(cx-7,fy-14,cx-8,fy,6.5);c2.fill();
  c2.fillStyle=CA+'44';c2circ(cx-7,fy-14,6.5);c2.fill();
  c2.fillStyle='#333';c2.beginPath();c2.ellipse(cx-11,fy-3,9,5,0,0,Math.PI*2);c2.fill();

  // Head
  const hg=c2.createRadialGradient(cx+2,fy-66,2,cx,fy-64,11);
  hg.addColorStop(0,C2);hg.addColorStop(1,C1);
  c2.fillStyle=hg;c2circ(cx,fy-64,11);c2.fill();
  c2.fillStyle=CA;c2.shadowColor=CA;c2.shadowBlur=6;
  c2.beginPath();c2.arc(cx,fy-64,11,Math.PI,0);c2.closePath();c2.fill();c2.shadowBlur=0;
  c2.fillStyle='#000a';c2.fillRect(cx-10,fy-65,20,5);
  c2.fillStyle=charDef.glow;c2.shadowColor=charDef.glow;c2.shadowBlur=10;
  c2.beginPath();c2.ellipse(cx+2,fy-63,3.5,2,0,0,Math.PI*2);c2.fill();c2.shadowBlur=0;
  c2.fillStyle=CA+'66';c2.fillRect(cx-11,fy-65,3,7);c2.fillRect(cx+8,fy-65,3,7);

  // Front arm
  c2.fillStyle=C2;
  c2cap(cx+10,fy-48,cx+16,fy-37,5.5);c2.fill();c2cap(cx+16,fy-37,cx+12,fy-27,4.5);c2.fill();
  c2circ(cx+12,fy-27,6.5);c2.fill();

  // Weapon preview
  const wx=cx+12,wy=fy-27,ax=cx+16,ay=fy-37;
  const ddx=wx-ax,ddy=wy-ay,dl=Math.sqrt(ddx*ddx+ddy*ddy)||1;
  const dux=ddx/dl,duy=ddy/dl,dpx=-duy,dpy=dux;
  c2.save();
  if(charDef.weapon==='katana'){
    const h0x=wx-dux*3,h0y=wy-duy*3,h1x=wx+dux*16,h1y=wy+duy*16;
    c2.fillStyle='#2a1505';c2cap(h0x,h0y,h1x,h1y,2.8);c2.fill();
    c2.fillStyle='#777';c2cap(h1x+dpx*7,h1y+dpy*7,h1x-dpx*7,h1y-dpy*7,2.5);c2.fill();
    const tipx=wx+dux*64,tipy=wy+duy*64;
    const bg2=c2.createLinearGradient(h1x,h1y,tipx,tipy);
    bg2.addColorStop(0,'#d8d8d8');bg2.addColorStop(1,'#aaccff');c2.fillStyle=bg2;
    c2.beginPath();c2.moveTo(h1x+dpx*2.5,h1y+dpy*2.5);c2.lineTo(h1x-dpx*2.5,h1y-dpy*2.5);c2.lineTo(tipx,tipy);c2.closePath();c2.fill();
    c2.shadowColor=charDef.glow;c2.shadowBlur=8;c2.strokeStyle=charDef.accent+'88';c2.lineWidth=0.8;c2.stroke();
  }else if(charDef.weapon==='hammer'){
    c2.fillStyle='#5a3810';c2cap(wx,wy,wx+dux*10,wy+duy*10,3.5);c2.fill();
    const hg3=c2.createLinearGradient(wx+dpx*14,wy+dpy*14,wx-dpx*14,wy-dpy*14);
    hg3.addColorStop(0,'#3a3a3a');hg3.addColorStop(0.5,'#aaa');hg3.addColorStop(1,'#2a2a2a');
    c2.fillStyle=hg3;c2cap(wx+dux*12+dpx*14,wy+duy*12+dpy*14,wx-dux*12+dpx*14,wy-duy*12+dpy*14,11);c2.fill();
    c2.shadowColor=charDef.glow;c2.shadowBlur=10;c2.strokeStyle=charDef.accent;c2.lineWidth=1.5;c2.stroke();
  }else if(charDef.weapon==='daggers'){
    [[wx,wy,dux,duy,dpx,dpy],[cx-12,fy-32,-dux,-duy,-dpx,-dpy]].forEach(([x,y,ux2,uy2,px2,py2])=>{
      c2.fillStyle='#1a1520';c2cap(x,y,x+ux2*13,y+uy2*13,2.5);c2.fill();
      c2.fillStyle='#555';c2cap(x+ux2*11-px2*5,y+uy2*11-py2*5,x+ux2*11+px2*5,y+uy2*11+py2*5,2);c2.fill();
      const t=[x+ux2*40,y+uy2*40];
      const d3=c2.createLinearGradient(x+ux2*13,y+uy2*13,t[0],t[1]);d3.addColorStop(0,'#bbb');d3.addColorStop(1,'#d8ffda');
      c2.fillStyle=d3;c2.beginPath();c2.moveTo(x+ux2*13+px2*2,y+uy2*13+py2*2);c2.lineTo(x+ux2*13-px2*2,y+uy2*13-py2*2);c2.lineTo(t[0],t[1]);c2.closePath();c2.fill();
    });
    c2.shadowColor=charDef.glow;c2.shadowBlur=8;
  }else{ // scythe
    const tipx2=wx-dux*8+dpy*60,tipy2=wy-duy*8-dpx*60;
    c2.fillStyle='#1a1828';c2cap(wx,wy,tipx2,tipy2,2.8);c2.fill();
    const sg=c2.createLinearGradient(tipx2,tipy2,tipx2+52,tipy2-20);
    sg.addColorStop(0,'#330044');sg.addColorStop(0.5,'#9900bb');sg.addColorStop(1,'#ff44ee');
    c2.fillStyle=sg;c2.shadowColor=charDef.glow;c2.shadowBlur=12;
    c2.beginPath();c2.moveTo(tipx2,tipy2);c2.bezierCurveTo(tipx2+16,tipy2-11,tipx2+44,tipy2-22,tipx2+56,tipy2-14);c2.bezierCurveTo(tipx2+44,tipy2-6,tipx2+20,tipy2+8,tipx2+4,tipy2+10);c2.closePath();c2.fill();
  }
  c2.shadowBlur=0;c2.restore();

  // Glow aura ring
  c2.strokeStyle=charDef.glow+'55';c2.lineWidth=2;c2.shadowColor=charDef.glow;c2.shadowBlur=16;
  c2.beginPath();c2.ellipse(cx,fy-42,20,38,0,0,Math.PI*2);c2.stroke();c2.shadowBlur=0;
}

function buildSelect(){
  ['p1-grid','p2-grid'].forEach((id,pi)=>{
    const grid=document.getElementById(id);
    grid.innerHTML='';
    CHARS.forEach(ch=>{
      const card=document.createElement('div');card.className='char-card';
      const cv=document.createElement('canvas');cv.width=90;cv.height=120;
      drawCharPreview(ch,cv);
      card.appendChild(cv);
      card.innerHTML+=`<div class="cname" style="color:${ch.glow}">${ch.name}</div>
        <div class="ctitle">${ch.title}</div>
        <div class="stats"><pre style="font-family:'Courier New';font-size:9px;color:#777">${ch.desc}</pre></div>`;
      card.onclick=()=>{
        grid.querySelectorAll('.char-card').forEach(c=>c.classList.remove('sel'));
        card.classList.add('sel');
        if(pi===0)p1sel=ch.id;else p2sel=ch.id;
        const both=p1sel&&(p2sel||mode==='cpu');
        const btn=document.getElementById('btn-fight');
        btn.style.opacity=both?'1':'.4';btn.style.pointerEvents=both?'all':'none';
        if(mode==='cpu'&&pi===0){
          // auto-pick CPU as different char
          const others=CHARS.filter(c=>c.id!==p1sel);
          p2sel=others[Math.floor(Math.random()*others.length)].id;
        }
      };
      grid.appendChild(card);
    });
  });
  document.getElementById('p2-grid').style.display=mode==='cpu'?'none':'flex';
  document.getElementById('p2-label').textContent=mode==='cpu'?'CPU':'PLAYER 2';
}

function showSelect(){
  buildSelect();
  p1sel=null;p2sel=null;
  document.getElementById('btn-fight').style.opacity='.4';
  document.getElementById('btn-fight').style.pointerEvents='none';
  document.getElementById('scr-select').classList.add('show');
  ui.classList.add('active');
}

function showMenu(){
  gameState='menu';
  document.getElementById('scr-menu').classList.add('show');
  ui.classList.add('active');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('btn-1p').onclick=()=>{mode='cpu';hideAllScreens();showSelect();AC.resume();};
document.getElementById('btn-2p').onclick=()=>{mode='2p'; hideAllScreens();showSelect();AC.resume();};
document.getElementById('btn-fight'||'').onclick=()=>{};
document.addEventListener('click',e=>{if(e.target.id==='btn-fight'){hideAllScreens();wins=[0,0];round=1;startFight();}});

document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key]=false;});

// init preview fighters so background renders nicely
p1=makeFighter(CHARS[0],160,1);
p2=makeFighter(CHARS[3],640,-1);
gameState='menu';ui.classList.add('active');

function loop(){
  try{update();draw();}catch(e){console.error('game error:',e);}
  requestAnimationFrame(loop);
}
loop();
</script>
